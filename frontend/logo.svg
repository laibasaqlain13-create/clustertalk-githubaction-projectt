<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="ClusterTalk">
  <defs>
    <linearGradient id="ctCy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="ctCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </radialGradient>
    <filter id="ctGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="ctHex" d="M0,-9 L7.8,-4.5 L7.8,4.5 L0,9 L-7.8,4.5 L-7.8,-4.5 Z"/>
  </defs>

  <g filter="url(#ctGlow)">
    <!-- outer orbit -->
    <circle cx="60" cy="60" r="47" stroke="#22d3ee" stroke-width="1" opacity="0.30"/>
    <circle cx="60" cy="60" r="40" stroke="#38bdf8" stroke-width="0.8" opacity="0.18"/>

    <!-- spokes from hub to each node -->
    <g stroke="url(#ctCy)" stroke-width="1.5" opacity="0.8">
      <line x1="60" y1="60" x2="60"   y2="20"/>
      <line x1="60" y1="60" x2="94.6" y2="40"/>
      <line x1="60" y1="60" x2="94.6" y2="80"/>
      <line x1="60" y1="60" x2="60"   y2="100"/>
      <line x1="60" y1="60" x2="25.4" y2="80"/>
      <line x1="60" y1="60" x2="25.4" y2="40"/>
    </g>

    <!-- node hexagons -->
    <g fill="#0b1020" stroke="url(#ctCy)" stroke-width="1.6" stroke-linejoin="round">
      <use href="#ctHex" transform="translate(60,20)"/>
      <use href="#ctHex" transform="translate(94.6,40)"/>
      <use href="#ctHex" transform="translate(94.6,80)"/>
      <use href="#ctHex" transform="translate(60,100)"/>
      <use href="#ctHex" transform="translate(25.4,80)"/>
      <use href="#ctHex" transform="translate(25.4,40)"/>
    </g>
    <!-- node cores -->
    <g fill="#67e8f9">
      <circle cx="60"   cy="20"  r="2.4"/>
      <circle cx="94.6" cy="40"  r="2.4"/>
      <circle cx="94.6" cy="80"  r="2.4"/>
      <circle cx="60"   cy="100" r="2.4"/>
      <circle cx="25.4" cy="80"  r="2.4"/>
      <circle cx="25.4" cy="40"  r="2.4"/>
    </g>

    <!-- central hub -->
    <g transform="translate(60,60)">
      <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z"
            fill="#0b1020" stroke="url(#ctCy)" stroke-width="2"/>
      <circle cx="0" cy="0" r="9.5" stroke="#7dd3fc" stroke-width="1.2" opacity="0.7"/>
      <circle cx="0" cy="0" r="3.4" fill="url(#ctCore)"/>
    </g>
  </g>
</svg>
