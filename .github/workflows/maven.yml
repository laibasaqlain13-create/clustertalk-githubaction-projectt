name: ClusterTalk CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # JOB 1: Build, Test, and Quality Checks
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Install testing and linting tools
          pip install pytest flake8

      - name: Lint Code with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Unit Tests with Pytest
        run: |
          # Runs tests if a tests folder or test files exist; continues gracefully if not yet created
          if [ -d "tests" ] || ls test_*.py 1>/dev/null 2>&1; then
            pytest
          else
            echo "No unit tests found. Skipping test execution."
          fi

  # -------------------------------------------------------------
  # JOB 2: Security Scans (Vulnerabilities & Secret Leaks)
  # -------------------------------------------------------------
  security-checks:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Scan Python Dependencies for Vulnerabilities (Safety)
        run: |
          python -m pip install --upgrade pip
          pip install safety
          if [ -f requirements.txt ]; then
            safety check -r requirements.txt || echo "Security warnings found in dependencies."
          fi

      - name: Scan Code for Hardcoded Secrets (TruffleHog)
        uses: trufflesecurity/trufflehog-actions-scan@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

  # -------------------------------------------------------------
  # JOB 3: Build & Package Verification
  # -------------------------------------------------------------
  build-artifact:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: security-checks

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Web Frontend Assets
        run: |
          echo "Checking web assets..."
          if [ -f "index.html" ] || [ -d "static" ] || [ -d "templates" ]; then
            echo "Frontend assets verified successfully."
          else
            echo "Frontend files not found in root, proceeding with general build check."
          fi

      - name: Archive Repository Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clustertalk-build
          path: |
            .
            !.git
            !.github
