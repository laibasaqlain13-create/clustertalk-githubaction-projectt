name: Build, Test, Security & Deploy

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]


# ============================================================
# GITHUB PAGES PERMISSIONS
# ============================================================

permissions:
  contents: read
  pages: write
  id-token: write


# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: "pages"
  cancel-in-progress: false


jobs:

  # ==========================================================
  # JOB 1 — BUILD
  # ==========================================================

  build:
    name: Build & Compile
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # Checkout Repository
      # -----------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # -----------------------------
      # Setup Python
      # -----------------------------

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # -----------------------------
      # Install Dependencies
      # -----------------------------

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found."
          fi


      # -----------------------------
      # Compile Python Files
      # -----------------------------

      - name: Compile Python Files
        run: |
          echo "Checking Python files..."

          PY_FILES=$(find . \
            -type f \
            -name "*.py" \
            -not -path "./.git/*" \
            -not -path "./.venv/*" \
            -not -path "./venv/*")

          if [ -z "$PY_FILES" ]; then
            echo "No Python files found."
            echo "Skipping Python compilation."
          else
            echo "Python files found:"
            echo "$PY_FILES"

            python -m py_compile $PY_FILES

            echo "Python compilation successful."
          fi


  # ==========================================================
  # JOB 2 — TEST
  # ==========================================================

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    needs: build

    steps:

      # -----------------------------
      # Checkout
      # -----------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # -----------------------------
      # Setup Python
      # -----------------------------

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # -----------------------------
      # Install Testing Tools
      # -----------------------------

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi


      # -----------------------------
      # Run Tests
      # -----------------------------

      - name: Run Unit Tests
        run: |
          if [ -d "tests" ]; then
            pytest
          elif find . -maxdepth 2 -type f -name "test_*.py" | grep -q .; then
            pytest
          else
            echo "No tests found."
            echo "Skipping tests."
          fi


  # ==========================================================
  # JOB 3 — SECURITY
  # ==========================================================

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    needs: build

    steps:

      # -----------------------------
      # Checkout
      # -----------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # -----------------------------
      # Setup Python
      # -----------------------------

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # -----------------------------
      # Install Security Tools
      # -----------------------------

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety


      # -----------------------------
      # Bandit
      # -----------------------------

      - name: Run Bandit Security Scan
        run: |
          if find . -type f -name "*.py" -not -path "./.git/*" | grep -q .; then

            bandit -r . \
              -x ./.git,./.venv,./venv \
              || echo "Bandit found issues. Review the report."

          else

            echo "No Python files found."
            echo "Skipping Bandit."

          fi


      # -----------------------------
      # Safety
      # -----------------------------

      - name: Run Dependency Security Scan
        run: |
          if [ -f requirements.txt ]; then

            safety check -r requirements.txt \
              || echo "Safety found dependency issues. Review the report."

          else

            echo "No requirements.txt found."
            echo "Skipping Safety."

          fi


  # ==========================================================
  # JOB 4 — DEPLOY TO GITHUB PAGES
  # ==========================================================

  deploy:
    name: Deploy to GitHub Pages

    runs-on: ubuntu-latest

    needs:
      - build
      - test
      - security

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      # -----------------------------
      # Checkout Repository
      # -----------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # -----------------------------
      # Configure GitHub Pages
      # -----------------------------

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5


      # ======================================================
      # CHECK WEBSITE
      # ======================================================

      - name: Check Website Files
        run: |

          echo "Checking website..."

          if [ -f "index.html" ]; then

            echo "===================================="
            echo "index.html FOUND"
            echo "===================================="

          else

            echo "===================================="
            echo "ERROR: index.html NOT FOUND"
            echo "===================================="

            echo ""
            echo "Files in repository:"
            find . -maxdepth 2 -type f \
              -not -path "./.git/*" | sort

            exit 1

          fi


      # ======================================================
      # SHOW WEBSITE STRUCTURE
      # ======================================================

      - name: Show Website Structure
        run: |

          echo "Website files:"
          echo "------------------------------------"

          find . -maxdepth 2 -type f \
            -not -path "./.git/*" | sort

          echo "------------------------------------"


      # ======================================================
      # UPLOAD WEBSITE
      # ======================================================

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."


      # ======================================================
      # DEPLOY
      # ======================================================

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
