name: Build, Test, Security & Deploy

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]


# ============================================================
# GITHUB PAGES PERMISSIONS
# ============================================================

permissions:
  contents: read
  pages: write
  id-token: write


# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: "pages"
  cancel-in-progress: false


jobs:

  # ==========================================================
  # JOB 1 — BUILD
  # ==========================================================

  build:
    name: Build & Compile
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found."
          fi


      - name: Compile Python Files
        run: |
          echo "Checking Python files..."

          PY_FILES=$(find . \
            -type f \
            -name "*.py" \
            -not -path "./.git/*" \
            -not -path "./.venv/*" \
            -not -path "./venv/*")

          if [ -z "$PY_FILES" ]; then
            echo "No Python files found."
            echo "Skipping Python compilation."
          else
            echo "Python files found:"
            echo "$PY_FILES"

            python -m py_compile $PY_FILES

            echo "Python compilation successful."
          fi


  # ==========================================================
  # JOB 2 — TEST
  # ==========================================================

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi


      - name: Run Unit Tests
        continue-on-error: true
        run: |
          if [ -d "tests" ]; then

            echo "Tests folder found."
            pytest

          elif find . -maxdepth 2 -type f -name "test_*.py" | grep -q .; then

            echo "Test files found."
            pytest

          else

            echo "No tests found."
            echo "Skipping tests."

          fi


  # ==========================================================
  # JOB 3 — SECURITY
  # ==========================================================

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety


      - name: Run Bandit Security Scan
        continue-on-error: true
        run: |
          if find . \
            -type f \
            -name "*.py" \
            -not -path "./.git/*" \
            -not -path "./.venv/*" \
            -not -path "./venv/*" | grep -q .; then

            bandit -r . \
              -x ./.git,./.venv,./venv

          else

            echo "No Python files found."
            echo "Skipping Bandit."

          fi


      - name: Run Dependency Security Scan
        continue-on-error: true
        run: |
          if [ -f requirements.txt ]; then

            safety check -r requirements.txt

          else

            echo "No requirements.txt found."
            echo "Skipping Safety."

          fi


  # ==========================================================
  # JOB 4 — DEPLOY TO GITHUB PAGES
  # ==========================================================

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest

    needs:
      - build
      - test
      - security

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      # --------------------------------------------------------
      # Checkout Repository
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Configure GitHub Pages
      # --------------------------------------------------------

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5


      # --------------------------------------------------------
      # Check Website
      # --------------------------------------------------------

      - name: Check Website Files
        run: |

          echo "Checking for index.html..."

          if [ -f "index.html" ]; then

            echo "======================================"
            echo "index.html FOUND"
            echo "======================================"

          elif [ -f "frontend/index.html" ]; then

            echo "======================================"
            echo "frontend/index.html FOUND"
            echo "======================================"

          elif [ -f "dist/index.html" ]; then

            echo "======================================"
            echo "dist/index.html FOUND"
            echo "======================================"

          elif [ -f "build/index.html" ]; then

            echo "======================================"
            echo "build/index.html FOUND"
            echo "======================================"

          else

            echo "======================================"
            echo "ERROR: index.html NOT FOUND"
            echo "======================================"

            echo ""
            echo "Files in repository:"
            find . -maxdepth 3 -type f \
              -not -path "./.git/*" | sort

            exit 1

          fi


      # --------------------------------------------------------
      # Select Website Folder
      # --------------------------------------------------------

      - name: Select Website Directory
        run: |

          if [ -f "index.html" ]; then

            echo "SITE_DIR=." >> "$GITHUB_ENV"

          elif [ -f "frontend/index.html" ]; then

            echo "SITE_DIR=./frontend" >> "$GITHUB_ENV"

          elif [ -f "dist/index.html" ]; then

            echo "SITE_DIR=./dist" >> "$GITHUB_ENV"

          elif [ -f "build/index.html" ]; then

            echo "SITE_DIR=./build" >> "$GITHUB_ENV"

          else

            echo "Website directory could not be found."
            exit 1

          fi


      # --------------------------------------------------------
      # Show Files That Will Be Deployed
      # --------------------------------------------------------

      - name: Verify Deployment Files
        run: |

          echo "======================================"
          echo "Website directory:"
          echo "$SITE_DIR"
          echo "======================================"

          echo ""
          echo "Files to deploy:"

          find "$SITE_DIR" -maxdepth 3 -type f | sort


      # --------------------------------------------------------
      # Upload Pages Artifact
      # --------------------------------------------------------

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}


      # --------------------------------------------------------
      # Deploy
      # --------------------------------------------------------

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
