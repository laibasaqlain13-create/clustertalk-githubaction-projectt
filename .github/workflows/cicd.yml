name: Python Build, Test & Security Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # JOB 1: Build & Compile Check
  # -------------------------------------------------------------
  build:
    name: Build & Compile Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compile Python Files (Syntax Check)
        run: |
          python -m compileall .

  # -------------------------------------------------------------
  # JOB 2: Automated Unit Testing
  # -------------------------------------------------------------
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Tests
        run: |
          if [ -d "tests" ] || ls test_*.py 1>/dev/null 2>&1; then
            pytest
          else
            echo "No unit tests found. Skipping pytest."
          fi

  # -------------------------------------------------------------
  # JOB 3: Security & Vulnerability Analysis
  # -------------------------------------------------------------
  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Scan Code for Security Issues (Bandit)
        run: |
          # Scans Python files for common security vulnerabilities
          bandit -r . -x ./.venv || echo "Security issues found, review bandit logs."

      - name: Scan Dependencies for Known Vulnerabilities (Safety)
        run: |
          if [ -f requirements.txt ]; then
            safety check -r requirements.txt || echo "Vulnerabilities found in requirements.txt."
          fi
